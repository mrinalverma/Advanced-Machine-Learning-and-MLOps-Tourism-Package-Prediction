name: MLOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Data Preparation
  data-preparation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Data Validation
      run: python src/data_validation.py

    - name: Run Data Preparation
      run: python src/data_preparation.py

    # This fulfills the "workflow artifact" requirement
    - name: Upload Train/Test Splits as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: data-splits
        path: artifacts/
        retention-days: 1

  # JOB 2: Model Training
  model-training:
    needs: data-preparation   # This ensures it runs AFTER Job 1
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    # Retrieves the artifact saved by Job 1
    - name: Download Train/Test Splits Artifact
      uses: actions/download-artifact@v4
      with:
        name: data-splits
        path: artifacts/

    - name: Run Model Training
      run: python src/model_training.py